# electron-builder configuration
# Docs: https://www.electron.build/configuration/configuration

appId: io.github.luiscriativo.tecius
productName: Tecius
copyright: Copyright © 2026 Tecius

# ── Directories ──────────────────────────────────────────────────────────────
directories:
  buildResources: resources
  output: dist

# ── ASAR packaging ───────────────────────────────────────────────────────────
# asar: true packs all app files into a single encrypted archive.
# asarUnpack extracts bytenode so Electron can load native bindings at runtime.
asar: true
asarUnpack:
  - "node_modules/bytenode/**/*"

# ── Files to include in the package ─────────────────────────────────────────
files:
  - out/**/*
  - "!**/*.map"
  - "!**/*.d.ts"

# ── Licenças (a GPL exige que o texto acompanhe o app distribuído) ────────────
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: src/renderer/src/assets/geo/historical/NOTICE.md
    to: NOTICE-historical-borders.md

# ── Assinatura ad-hoc no macOS sem certificado (ver scripts/adhoc-sign.js) ─────
afterSign: scripts/adhoc-sign.js

# ── Application metadata ─────────────────────────────────────────────────────
extraMetadata:
  main: out/main/index.js

# ── Auto-updater publish configuration ───────────────────────────────────────
# Releases publicados no GitHub Releases são usados como fonte de atualização.
# Configure GH_TOKEN no ambiente antes de rodar `npm run build:win` para publicar.
publish:
  provider: github
  owner: luiscriativo
  repo: tecius
  releaseType: release

# ── Windows configuration ────────────────────────────────────────────────────
win:
  executableName: Tecius
  icon: resources/icon.ico
  # Code signing (configure when ready)
  # certificateFile: path/to/cert.pfx
  # certificatePassword: ${env.WIN_CERT_PASSWORD}
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64

# Nomes no padrão Tecius-<versão>-<sistema>-<arquitetura> (como Logseq, Mattermost,
# MarkText): cada arquitetura é gerada numa máquina própria no CI
# (.github/workflows/release.yml) e o auto-update escolhe o arquivo pelo nome
# (procura "x64" / "arm64"). O bytecode do processo principal é específico da
# arquitetura, então um instalador não pode levar as duas.
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Tecius
  deleteAppDataOnUninstall: false

# ── macOS configuration ───────────────────────────────────────────────────────
mac:
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  icon: resources/icon.png
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Code signing (configure when ready)
  # identity: "Developer ID Application: Your Name (TEAM_ID)"
  # Só .dmg: sem certificado da Apple a atualização no Mac é manual (o aviso leva ao
  # .dmg), então o .zip — que só o atualizador automático usa — não é publicado
  target:
    - target: dmg
      arch:
        - x64
        - arm64

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

dmg:
  title: Tecius
  icon: resources/icon.png
  iconSize: 80
  window:
    width: 540
    height: 380

# ── Linux configuration ───────────────────────────────────────────────────────
linux:
  icon: resources/icon.png
  executableName: tecius
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  maintainer: luiscriativo <luiscriativo@gmail.com>
  vendor: luiscriativo
  category: Education
  synopsis: Personal historical timeline manager
  description: >-
    Organize events, periods and narratives on a visual timeline and a map
    through time, stored as plain Markdown files in a folder on your computer.
  # AppImage roda em qualquer distribuição e se atualiza sozinho; .deb (Debian/Ubuntu)
  # e .rpm (Fedora/openSUSE) instalam pelo gerenciador de pacotes
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64

deb:
  packageCategory: utils
  priority: optional

# ── Build optimization ────────────────────────────────────────────────────────
compression: maximum
removePackageScripts: true
