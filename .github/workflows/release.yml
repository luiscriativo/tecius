# Release do Tecius
#
# Como usar: suba a versão no package.json, faça o commit e envie uma tag igual:
#   git tag v1.5.0 && git push origin v1.5.0
# O workflow gera os instaladores de cada sistema e cria um RASCUNHO de release
# no GitHub com tudo anexado. Confira e clique em "Publish release" — só então o
# auto-update dos apps instalados enxerga a versão nova.
#
# Sem acesso para enviar tags (ex.: login do GitHub pelo Google, sem token): use
# Actions → Release → Run workflow e informe a versão (ex.: v1.5.0). O workflow
# cria a tag no commit escolhido e o rascunho da release — ou usa um rascunho
# que já exista com esse nome, mantendo a descrição.
# Sem informar a versão, Run workflow só gera os builds, como artefatos, sem
# criar release — serve para testar.
#
# Por que uma máquina por arquitetura: o scripts/protect.js compila o processo
# principal em bytecode com o Electron da máquina que faz o build, e esse
# bytecode é específico da arquitetura. Os nomes dos arquivos levam a
# arquitetura (electron-builder.yml) e o scripts/merge-update-info.cjs junta os
# latest*.yml de cada máquina num só por sistema.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão a lançar (ex.: v1.5.0). Vazio = só testar os builds, sem release.'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Versão da release: a tag enviada, ou a informada no Run workflow (vazio = sem release)
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}

jobs:
  check:
    name: Checagem
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Versão igual à do package.json
        if: env.RELEASE_TAG != ''
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::A versão $RELEASE_TAG não bate com a do package.json ($VERSION)."
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: mac-arm64
            os: macos-15
            args: --mac dmg zip --arm64
          - name: mac-x64
            os: macos-15-intel
            args: --mac dmg zip --x64
          - name: win-x64
            os: windows-latest
            args: --win nsis portable --x64
          - name: win-arm64
            os: windows-11-arm
            args: --win nsis --arm64
    env:
      # Sem certificado: o macOS recebe assinatura ad-hoc (scripts/adhoc-sign.js).
      # Com um Developer ID, configure CSC_LINK / CSC_KEY_PASSWORD como secrets e remova esta linha.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Proteção (bytecode + ofuscação)
        run: node scripts/protect.js
      - name: Empacotar
        run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Rascunho da release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: builds
      - name: Juntar os builds
        run: |
          npm install --prefix "$RUNNER_TEMP/yaml" --no-save --no-package-lock js-yaml@4
          NODE_PATH="$RUNNER_TEMP/yaml/node_modules" node scripts/merge-update-info.cjs builds release
      - name: Criar a tag (Run workflow com versão)
        # Tag criada com o token do workflow não dispara outro run. Ela já existe ao
        # publicar o rascunho, então publicar também não dispara nada.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::A tag $RELEASE_TAG já existe no GitHub. Para refazer os builds dela, rode o workflow a partir da tag."
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
      - name: Criar ou atualizar o rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Um rascunho já criado no site com este nome é aproveitado (mantém a descrição)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --draft --title "Tecius ${RELEASE_TAG#v}" --generate-notes
          fi
